#              tests do not reach. Written for the examiner; reading it would
#              tell you where to look.
#   questions  the questions that are always put, word for word. In your copy
#              they would be questions to rehearse rather than to answer.
#   solution   the reference implementation. In your copy it is a file you
#              could open.
