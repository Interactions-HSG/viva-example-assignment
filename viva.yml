# What the viva examines this submission against.
#
# You can read this file, and you could edit it — it is in your own copy. So it
# holds the half of the brief that is no secret: *what* you are examined on.
# The other half — how the examiner should steer, the questions it always asks,
# and the reference solution — is held by the exam server under the name below,
# where it is nobody's to read in advance. See viva-example-solution.
#
# Editing any of this does not change what you will be asked. The course's copy
# wins field by field, and the transcript records which of the two was used.

version: 1

# Which brief on the exam server governs this assignment.
assignment: viva-example

# The learning objectives. Stated here on purpose: knowing what you will be
# examined on is not the same as knowing what you will be asked, and the first
# one is only fair. The course's copy of these is the one that counts.
#
# Each one carries its level in the revised Bloom taxonomy, and the level is
# not decoration: it is what the examiner uses to decide what a question has to
# demand. An `analyse` objective is not examined by asking you to describe, and
# an `evaluate` one is not examined by a question with a single right answer.
goals:
  - id: what-the-limit-means
    level: analyse
    goal: >
      Trace, through your own code, over which stretch of time a client's
      allowance is counted, and work out what a client can get through at the
      edge of it.

  - id: which-clock
    level: evaluate
    goal: >
      Judge which clock a rate limiter should read, and defend the choice
      against a machine whose time is corrected while a client is inside its
      window.

  - id: what-it-holds
    level: analyse
    goal: >
      Work out what your limiter accumulates per client, and what is left
      behind by clients that never come back.

# Deliberately not here, and not by accident:
