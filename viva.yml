version: 1

# Which brief on the exam server governs this task.
assignment: viva-example

# The learning objectives. Stated here on purpose: knowing what you will be
# examined on is not the same as knowing what you will be asked, and the first
# one is only fair. The course's copy of these is the one that counts.
goals:
  - id: what-the-limit-means
    goal: >
      Say what "three requests a minute" actually means in your
      implementation — over which stretch of time it is counted, and what a
      client can get away with at the edge of it.

  - id: which-clock
    goal: >
      Know which clock your limiter reads, and what happens to a client the
      next time that clock is corrected or stepped.

  - id: what-it-holds
    goal: >
      Say what your limiter accumulates per client, and what that costs after
      a great many clients that never come back.

